# Candidate catalog only. The runner materializes the identical exact entries
# as separate files before any producer starts; no wildcard enrollment.
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata: {name: qualification-events}
spec:
  pubsubname: pubsub
  topic: qualification.events
  routes: {default: /events}
  metadata: {queueType: quorum}
scopes: [qualification-consumer]