name: Dapr durable broker qualification (non-promoting)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QUALIFICATION_OUTPUT: /tmp/story-3-21-qualification
      QUALIFICATION_DAPRD: /tmp/qualification-tools/runtime/daprd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Install exact CLI/runtime binaries from the candidate lock
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, tarfile, urllib.request
          profile = json.loads(pathlib.Path('deploy/dapr/qualification/runtime-lock.json').read_text())
          root = pathlib.Path('/tmp/qualification-tools')
          for repository, version, archive, binary, expected, folder in [
              ('dapr/cli', profile['runtime']['cliVersion'], 'dapr_linux_amd64.tar.gz', 'dapr', profile['runtime']['cliSha256'], 'cli'),
              ('dapr/dapr', profile['runtime']['version'], 'daprd_linux_amd64.tar.gz', 'daprd', profile['runtime']['binarySha256'], 'runtime'),
          ]:
              url = f'https://github.com/{repository}/releases/download/v{version}/{archive}'
              data = urllib.request.urlopen(url, timeout=60).read()
              with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as package:
                  member = next(m for m in package.getmembers() if pathlib.PurePosixPath(m.name).name == binary and m.isfile())
                  content = package.extractfile(member).read()
              assert hashlib.sha256(content).hexdigest() == expected, f'{binary}: immutable binary mismatch'
              destination = root / folder / binary
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(content)
              destination.chmod(0o755)
          with open(os.environ['GITHUB_PATH'], 'a') as target:
              target.write(str(root / 'cli') + '\n')
          PY
      - name: Verify packet mutations
        run: python3 -m unittest discover -s tools/tests -p test_dapr_broker_qualification.py
      - name: Run owned local first-stage fault matrix
        run: >-
          python3 tools/qualify-dapr-brokers.py
          --profile deploy/dapr/qualification/runtime-lock.json
          --brokers rabbitmq,kafka --output "$QUALIFICATION_OUTPUT"
      - name: Independently verify truthful results
        if: always()
        run: python3 tools/validate-dapr-broker-qualification.py "$QUALIFICATION_OUTPUT" --allow-failures
      - name: Production eligibility remains a truthful FAIL
        if: always()
        run: python3 tools/validate-dapr-broker-qualification.py "$QUALIFICATION_OUTPUT" --require-production-authority
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: story-3-21-sanitized-non-authorizing-receipts
          path: ${{ env.QUALIFICATION_OUTPUT }}
          retention-days: 30
          if-no-files-found: error
