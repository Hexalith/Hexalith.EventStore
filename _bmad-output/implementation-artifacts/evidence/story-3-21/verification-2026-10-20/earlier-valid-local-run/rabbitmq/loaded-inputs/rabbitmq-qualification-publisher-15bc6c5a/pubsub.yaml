apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
spec:
  type: pubsub.rabbitmq
  version: v1
  metadata:
    - name: connectionString
      secretKeyRef: {name: qualification-absent, key: connectionString}
    - name: caCert
      secretKeyRef: {name: qualification-absent, key: caCert}
    - name: clientCert
      secretKeyRef: {name: qualification-absent, key: clientCert}
    - name: clientKey
      secretKeyRef: {name: qualification-absent, key: clientKey}
    - {name: consumerID, value: qualification-consumer}
    - {name: durable, value: "true"}
    - {name: deletedWhenUnused, value: "false"}
    - {name: autoAck, value: "false"}
    - {name: requeueInFailure, value: "true"}
    - {name: deliveryMode, value: "2"}
    - {name: publisherConfirm, value: "true"}
    - {name: prefetchCount, value: "1"}
    - {name: reconnectWaitSeconds, value: "1"}
    - {name: concurrency, value: single}
    - {name: exchangeKind, value: fanout}
    - {name: maxLen, value: "4"}
    - {name: allowedTopics, value: "qualification.events,qualification.poison,qualification.quarantine,qualification.failed-diversion,qualification.quarantine-denied,qualification.expiry,qualification.backpressure,qualification.missing-binding"}
    - {name: publishingScopes, value: "qualification-publisher=qualification.events,qualification.poison,qualification.failed-diversion,qualification.expiry,qualification.backpressure,qualification.missing-binding;qualification-consumer=qualification.quarantine"}
    - {name: subscriptionScopes, value: "qualification-consumer=qualification.events,qualification.poison,qualification.quarantine,qualification.failed-diversion,qualification.expiry,qualification.backpressure"}
auth:
  secretStore: openbao
scopes:
  - qualification-publisher
  - qualification-consumer
