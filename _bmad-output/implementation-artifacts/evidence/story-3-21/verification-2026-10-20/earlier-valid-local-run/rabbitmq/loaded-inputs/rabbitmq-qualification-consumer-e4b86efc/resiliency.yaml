{
  "apiVersion": "dapr.io/v1alpha1",
  "kind": "Resiliency",
  "metadata": {
    "name": "qualification"
  },
  "spec": {
    "policies": {
      "retries": {
        "bounded": {
          "duration": "200ms",
          "maxRetries": 2,
          "policy": "constant"
        }
      },
      "timeouts": {
        "bounded": "3s"
      }
    },
    "targets": {
      "components": {
        "pubsub": {
          "inbound": {
            "retry": "bounded",
            "timeout": "bounded"
          },
          "outbound": {
            "retry": "bounded",
            "timeout": "bounded"
          }
        }
      }
    }
  }
}
