# Preliminary planning register; Story 3.17 owns the final validated schema/guard.
schema_version: 1
updated: '2026-10-25'
status: preliminary-unqualified
policy: _bmad-output/planning-artifacts/prd.md#84-dapr-infrastructure-boundary
inventory_owner_story: 3-17-dapr-boundary-inventory-and-enforcement
accepted_exceptions:
  - id: signalr-replica-distribution
    disposition: accepted-scoped-exception
    accepted: '2026-10-25'
    owner: SignalR transport owner (project owner)
    owner_story: 2-13-dapr-notification-distribution-qualification
    decision: >-
      Owner decision 2026-10-25, single-maintainer-attested (the project has one
      maintainer; no independent review): keep the opt-in self-hosted SignalR Redis
      backplane for cross-replica hub messages instead of a Dapr replacement.
    retroactive: true
    retroactive_note: >-
      The backplane shipped before AD-34 was adopted. This decision accepts an existing
      dependency; it does not authorize introducing a new one.
    purpose: >-
      Covers the opt-in backplane already compiled into the EventStore and Gateway
      packages, used for Development/test multi-instance runs, so Story 3.17 treats it
      as an accepted row instead of an unresolved bypass. Production runs one EventStore
      replica with no multi-replica freshness claim (AD-26), which needs no exception.
    operations:
      - self-hosted-hub-cross-replica-distribution
    not_in_scope: >-
      Connection negotiation, authentication, tenant authorization and group joins
      stay in the application hub and are not covered by this exception. Shared-Redis
      use with channelPrefix is configuration of the allowed keys; it follows
      docs/operations/redis-signalr-channel-isolation.md and grants nothing beyond this entry.
    missing_guarantees:
      - >-
        Tenant enrollment: CFD-1 topics are {tenantId}.{projectionType}.projection-changed.
        pubsub.redis (Redis Streams) treats the shipped wildcard subscription
        *.*.projection-changed as one literal stream, so no tenant topic is delivered.
        Fan-out worked only with exact per-tenant subscriptions and an operator sidecar
        reload; new tenants are not enrolled automatically.
      - >-
        Replica restart: with stock daprd 1.18.7 (the only stock runtime tested), the
        surviving host's remote actor call fails after a peer restarts on the same internal
        endpoint. Only a disposable patched daprd built outside the repository passed; no
        released runtime with the fix was identified.
      - >-
        Production profile: the MVP target (self-hosted Kubernetes, 192.168.1.30) runs
        Dapr 1.18.1, below the AD-26 1.18.3 floor, with no durable broker, runtime or
        binding-capable AD-36 issuer selected.
    alternatives:
      - Dapr pub/sub fan-out with a per-replica consumer group; blocked by the three gaps above.
      - bindings.azure.signalr output binding; not run, because the owner excluded Azure from MVP on 2026-10-20, and the binding does not own self-hosted negotiation or group membership.
      - One fixed topic with tenant filtering in the application; avoids enrollment but changes the Story 2.8 / CFD-1 topic contract and AD-36 topic-bound provenance.
      - One EventStore replica with no multi-replica freshness claim (AD-26); needs no exception.
    isolated_adapter: >-
      ConfigureBackplane in SignalRServiceCollectionExtensions.cs calls
      AddStackExchangeRedis only when a backplane connection string is configured;
      otherwise the hub runs single-instance. No Dapr failure falls back to Redis.
    outage_behavior: >-
      AbortOnConnectFail is false, so an unreachable Redis does not stop the host:
      cross-replica messages are dropped while HTTP requests still succeed (measured:
      HTTP 200 with a FailOpenFailure diagnostic after about 6 s). Signals are hints;
      clients re-query persisted state, and no freshness claim relies on the backplane.
    credential_boundary: >-
      The Redis connection string, including any password, reaches the EventStore and
      Gateway host processes through the allowed configuration keys. Supply it from the
      deployment's secret source and never commit it. The Development-only runtime-proof
      endpoint reports it redacted.
    allowed_paths:
      - src/Hexalith.EventStore/SignalRHub/SignalRServiceCollectionExtensions.cs
      - src/Hexalith.EventStore/SignalRHub/SignalROptions.cs
      - src/Hexalith.EventStore/SignalRHub/ValidateSignalROptions.cs
      - src/Hexalith.EventStore/SignalRHub/SignalRRuntimeProofEndpoints.cs
      - src/Hexalith.EventStore/SignalRHub/SignalRRuntimeProofIdentity.cs
      - src/Hexalith.EventStore/Hexalith.EventStore.csproj
      - src/Hexalith.EventStore.Gateway/Hexalith.EventStore.Gateway.csproj
    allowed_package:
      id: Microsoft.AspNetCore.SignalR.StackExchangeRedis
      version: 10.0.13
      version_pin: references/Hexalith.Builds/Props/Directory.Packages.props
    tested_redis_server: 6.2.21 (local Development/test)
    allowed_configuration:
      - EventStore:SignalR:BackplaneRedisConnectionString
      - EVENTSTORE_SIGNALR_REDIS
    not_granted:
      - Production eligibility; AD-26 profile ratification still decides the freshness-signal replica posture.
      - Any other Redis client, operation, path or configuration key.
      - Fallback from a failed Dapr operation.
    evidence: _bmad-output/implementation-artifacts/2-13-dapr-notification-distribution-qualification.md#disposition--2026-10-25
    guard_handoff: 3-17-dapr-boundary-inventory-and-enforcement
    review_removal_trigger: >-
      Review this entry when any of the following changes, and remove it only when all
      hold: (1) an unpatched daprd at or above the AD-26 floor passes
      DaprRedisStreams_ReplicaRestart_ReauthorizesAndReconcilesPersistedState (today it
      passes only with HEXALITH_STORY_2_13_DAPRD_PATH pointing at the patched build);
      (2) a tenant-topic enrollment design exists; (3) an AD-26 profile names a durable
      broker and binding-capable issuer. Any change to the allowed paths, package
      version, configuration keys, Redis server major version or replica topology, or
      any production use of the backplane, needs a new decision.
