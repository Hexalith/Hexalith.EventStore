name: Dapr durable broker qualification (non-promoting)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Explicit runtime candidate (original remains the default)
        type: choice
        options: [original, '1.19.1']
        default: original

permissions:
  contents: read

jobs:
  disposable-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QUALIFICATION_OUTPUT: /tmp/story-3-21-qualification
      PYTHONDONTWRITEBYTECODE: '1'
      QUALIFICATION_EXCLUSIVE_WORKER: /tmp/qualification-worker.json
      QUALIFICATION_PROFILE: ${{ inputs.profile == '1.19.1' && 'deploy/dapr/qualification/runtime-lock-1.19.1.json' || 'deploy/dapr/qualification/runtime-lock.json' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Bind exclusive disposable worker allocation
        shell: bash
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib, subprocess
          assert os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted', 'exclusive hosted worker required'
          endpoint = 'unix://' + str(pathlib.Path('/var/run/docker.sock').resolve())
          daemon = subprocess.check_output(['docker', '--host', endpoint, 'info', '--format', '{{.ID}}'], text=True).strip()
          pathlib.Path(os.environ['QUALIFICATION_EXCLUSIVE_WORKER']).write_text(json.dumps({
              'exclusive': True, 'endpoint': endpoint, 'daemonId': daemon,
              'workerId': os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_JOB'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']}))
          PY
      - name: Install isolated exact CLI/runtime binaries
        run: python3 -B tools/install-dapr-qualification-tools.py --profile "$QUALIFICATION_PROFILE" --destination /tmp/qualification-tools
      - name: Verify packet and runtime mutations
        run: python3 -B -m unittest discover -s tools/tests -p 'test_dapr*qualification.py'
      - name: Run owned local first-stage fault matrix
        id: capture
        continue-on-error: true
        run: >-
          python3 -B tools/qualify-dapr-brokers.py
          --profile "$QUALIFICATION_PROFILE"
          --exclusive-worker "$QUALIFICATION_EXCLUSIVE_WORKER"
          --brokers rabbitmq,kafka --output "$QUALIFICATION_OUTPUT"
      - name: Independently verify truthful results
        if: always()
        id: integrity
        run: python3 -B tools/validate-dapr-broker-qualification.py "$QUALIFICATION_OUTPUT" --allow-failures
      - name: Independently evaluate technical qualification
        if: always()
        id: technical
        continue-on-error: true
        run: python3 -B tools/validate-dapr-broker-qualification.py "$QUALIFICATION_OUTPUT"
      - name: Production eligibility remains a truthful FAIL
        if: always()
        id: eligibility
        continue-on-error: true
        run: python3 -B tools/validate-dapr-broker-qualification.py "$QUALIFICATION_OUTPUT" --require-production-authority
      - name: Record separate outcomes
        if: always()
        env:
          CAPTURE: ${{ steps.capture.outcome }}
          INTEGRITY: ${{ steps.integrity.outcome }}
          TECHNICAL: ${{ steps.technical.outcome }}
          ELIGIBILITY: ${{ steps.eligibility.outcome }}
        run: |
          printf 'Capture: %s; integrity: %s; technical: %s; production authority check: %s (eligibility FAIL; selected broker null)\n' "$CAPTURE" "$INTEGRITY" "$TECHNICAL" "$ELIGIBILITY" >> "$GITHUB_STEP_SUMMARY"
          test "$CAPTURE" = success && test "$INTEGRITY" = success && test "$TECHNICAL" = success && test "$ELIGIBILITY" = failure
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: story-3-21-sanitized-non-authorizing-receipts
          path: ${{ env.QUALIFICATION_OUTPUT }}
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
