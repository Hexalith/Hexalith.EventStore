name: Payload Protection Lifecycle

# Story 8.5 isolated PF-02 lane. The existing core lane remains independently blocking.
# Capability, catalog, lease and indexed-transaction assertions are the foundation; lifecycle fault/concurrency cases
# must pass here before Story 8.5 can claim full PF-02 qualification.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: payload-protection-lifecycle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DAPR_CLI_VERSION: '1.18.0'
  DAPR_RUNTIME_VERSION: '1.18.7'
  UseHexalithProjectReferences: 'false'

jobs:
  payload-protection-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Initialize root-declared submodules
        run: git -c submodule.recurse=false submodule update --init

      - name: Initialize .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Initialize Dapr
        uses: ./references/Hexalith.Builds/Github/dapr-init
        with:
          version: ${{ env.DAPR_CLI_VERSION }}
          runtime-version: ${{ env.DAPR_RUNTIME_VERSION }}

      - name: Pull isolated PostgreSQL image
        run: docker pull postgres@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636

      - name: Record source revision
        run: git rev-parse HEAD

      - name: Restore lifecycle tests
        run: >-
          dotnet restore tests/Hexalith.EventStore.PayloadProtection.LiveSidecar.Tests/Hexalith.EventStore.PayloadProtection.LiveSidecar.Tests.csproj
          -p:Configuration=Release
          -p:UseHexalithProjectReferences=false

      - name: Build lifecycle tests
        run: >-
          dotnet build tests/Hexalith.EventStore.PayloadProtection.LiveSidecar.Tests/Hexalith.EventStore.PayloadProtection.LiveSidecar.Tests.csproj
          --no-restore --configuration Release -warnaserror -m:1
          -p:UseHexalithProjectReferences=false

      - name: Run persisted lifecycle qualification
        run: >-
          dotnet test --project tests/Hexalith.EventStore.PayloadProtection.LiveSidecar.Tests/Hexalith.EventStore.PayloadProtection.LiveSidecar.Tests.csproj
          --no-build --configuration Release
          --minimum-expected-tests 8 --fail-skips on
          --results-directory TestResults/Hexalith.EventStore.PayloadProtection.LiveSidecar.Tests
          --report-xunit-trx --report-xunit-trx-filename payload-protection-lifecycle-results.trx
          -p:UseHexalithProjectReferences=false

      - name: Upload lifecycle test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: payload-protection-lifecycle-test-results
          path: TestResults/Hexalith.EventStore.PayloadProtection.LiveSidecar.Tests/**/*.trx
          if-no-files-found: error
          retention-days: 7
