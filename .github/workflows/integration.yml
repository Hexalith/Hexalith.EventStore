name: Integration Tests

# Dedicated live-`daprd` integration suite. These tests (Category=LiveSidecar) need a real DAPR
# sidecar + Redis (via `dapr init`) and are intentionally OFF the per-push release path: they run
# here so flaky infrastructure never blocks semantic-release, while still giving signal on the
# adapter edge (actor/state-store round-trips). See
# sprint-change-proposal-2026-06-22-ci-release-retier.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DAPR_CLI_VERSION: '1.18.0'
  DAPR_RUNTIME_VERSION: '1.18.2'
  UseHexalithProjectReferences: 'false'

jobs:
  published-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DAPR_RUNTIME_VERSION: '1.18.4'
    steps:
      - name: Checkout exact executor and comparison tags
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Initialize only root Builds dependency
        run: git -c submodule.recurse=false submodule update --init references/Hexalith.Builds
      - name: Initialize .NET
        uses: ./references/Hexalith.Builds/Github/initialize-dotnet
        with:
          global-json-file: global.json
      - name: Pull the original qualified Redis profile
        run: docker pull redis@sha256:c35b83ce044bb6d148c484d36e059ad28e02d5714ba6731fb55b6421e2ed0ccf
      # The suite downloads checksum-verified 1.18.4 binaries into invocation scratch.
      # It never runs dapr init or changes another job's installed runtime/backend.
      - name: Build the isolated qualification runner
        run: |
          dotnet build tests/Hexalith.EventStore.PublishedCompatibility.Tests/Hexalith.EventStore.PublishedCompatibility.Tests.csproj \
            --configuration Release -m:1 -p:UseHexalithProjectReferences=false \
            -p:UseMicrosoftTestingPlatformRunner=true
      - name: Run isolated published qualification and ownership regressions
        run: |
          dotnet tests/Hexalith.EventStore.PublishedCompatibility.Tests/bin/Release/net10.0/Hexalith.EventStore.PublishedCompatibility.Tests.dll \
            --results-directory TestResults/published-compatibility \
            --report-xunit-trx --report-xunit-trx-filename published-compatibility.trx
      - name: Upload measured outcomes and bounded command logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-compatibility-results
          path: |
            TestResults/published-compatibility/**/*.trx
            /tmp/p1r-*/summary.json
            /tmp/p1r-*/scenarios.ndjson
            /tmp/p1r-*/focused-summary.json
            /tmp/p1r-*/startup-failure-*.json
            /tmp/p1r-*/late-descendant-cleanup.json
            /tmp/p1r-*/materialized-inputs.json
            /tmp/p1r-*/executor-inputs.json
            /tmp/p1r-*/cleanup.json
            /tmp/p1r-*/command-*.json
            /tmp/p1r-*/process-*.json
            /tmp/p1r-*/process-*.log
          if-no-files-found: error
          retention-days: 7

  live-sidecar:
    runs-on: ubuntu-latest
    # The six serial owner-replacement cases add substantial work to the live
    # suite. Allow the complete suite to finish while retaining every test and
    # each process phase's existing twenty-minute bound.
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # This test-only lane does not read Git history. Any history-reading step added
          # here must also change this checkout to fetch-depth: 0.
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      # Proof is the repository's tests plus CI; evidence folders are ignored local scratch.
      # These repository checks run in this required job because the required
      # ci / build-and-test job is the shared Hexalith.Builds reusable workflow,
      # which accepts no caller-defined steps.
      - name: Reject committed evidence and oversized files
        run: bash scripts/check-committed-files.sh

      - name: Verify committed-file guard regressions
        run: python3 -m unittest discover -s tools/tests -p 'test_check_committed_files.py'

      - name: Verify Dapr broker qualification inputs
        run: python3 -m unittest discover -s tools/tests -p 'test_dapr_broker_qualification.py'

      - name: Initialize Hexalith.Builds submodule
        run: git -c submodule.recurse=false submodule update --init references/Hexalith.Builds

      - name: Initialize .NET
        uses: ./references/Hexalith.Builds/Github/initialize-dotnet
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'nuget.config', 'Directory.Packages.props', 'references/Hexalith.Builds/Props/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Hexalith.EventStore.slnx -p:Configuration=Release -p:UseHexalithProjectReferences=false
      - name: Initialize Dapr
        uses: ./references/Hexalith.Builds/Github/dapr-init
        with:
          version: ${{ env.DAPR_CLI_VERSION }}
          runtime-version: ${{ env.DAPR_RUNTIME_VERSION }}

      # Story 4.14's Oq8PostgresqlFixture fails fast via `docker image inspect` instead of
      # pulling on demand (fail-closed by design), so the image must already be present.
      # Keep this reviewed multi-platform index in sync with PostgresImage in
      # tests/Hexalith.EventStore.Server.LiveSidecar.Tests/Fixtures/Oq8PostgresqlFixture.cs.
      - name: Pull PostgreSQL container image
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: docker pull postgres@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636

      - name: Run Live-Sidecar Integration Tests
        run: |
          dotnet test tests/Hexalith.EventStore.Server.LiveSidecar.Tests/ \
            --configuration Release \
            --no-restore \
            --results-directory TestResults/live-sidecar \
            --report-xunit-trx \
            --report-xunit-trx-filename live-sidecar-results.trx \
            --coverage \
            --coverage-output-format cobertura \
            --coverage-output coverage.cobertura.xml \
            -p:UseHexalithProjectReferences=false

      - name: Verify IntegrationTests serialized execution metadata
        run: |
          dotnet test tests/Hexalith.EventStore.IntegrationTests/Hexalith.EventStore.IntegrationTests.csproj \
            --configuration Release \
            --no-restore \
            --filter-class Hexalith.EventStore.IntegrationTests.AssemblyParallelizationTests \
            --results-directory TestResults/integration-parallelization \
            --report-xunit-trx \
            --report-xunit-trx-filename integration-parallelization-results.trx \
            -p:UseHexalithProjectReferences=false

      - name: Upload live-sidecar test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-sidecar-test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 7

      # NOTE: fixture-backed Tier-3 `IntegrationTests` classes spin up a full Aspire DistributedApplication
      # (Projects.Hexalith_EventStore_AppHost) which `dapr init` alone does not satisfy. Running it
      # reliably in GitHub-hosted CI needs a dedicated Aspire-in-CI setup and is tracked as a
      # follow-up — see sprint-change-proposal-2026-06-22-ci-release-retier.md.
