name: Integration Tests

# Dedicated live-`daprd` integration suite. These tests (Category=LiveSidecar) need a real DAPR
# sidecar + Redis (via `dapr init`) and are intentionally OFF the per-push release path: they run
# here so flaky infrastructure never blocks semantic-release, while still giving signal on the
# adapter edge (actor/state-store round-trips). See
# sprint-change-proposal-2026-06-22-ci-release-retier.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DAPR_CLI_VERSION: '1.18.0'
  DAPR_RUNTIME_VERSION: '1.18.2'
  UseHexalithProjectReferences: 'false'

jobs:
  live-sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Initialize Hexalith.Builds submodule
        run: git -c submodule.recurse=false submodule update --init references/Hexalith.Builds

      - name: Initialize .NET
        uses: ./references/Hexalith.Builds/Github/initialize-dotnet
        with:
          global-json-file: global.json

      - name: Install pinned OQ8 validator dependency
        run: |
          python3 -m venv "${RUNNER_TEMP}/oq8-python"
          "${RUNNER_TEMP}/oq8-python/bin/python" -m pip install --requirement requirements-oq8.txt
          echo "${RUNNER_TEMP}/oq8-python/bin" >> "$GITHUB_PATH"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'nuget.config', 'Directory.Packages.props', 'references/Hexalith.Builds/Props/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Hexalith.EventStore.slnx -p:Configuration=Release -p:UseHexalithProjectReferences=false
      - name: Initialize Dapr
        uses: ./references/Hexalith.Builds/Github/dapr-init
        with:
          version: ${{ env.DAPR_CLI_VERSION }}
          runtime-version: ${{ env.DAPR_RUNTIME_VERSION }}

      # Story 4.14's Oq8PostgresqlFixture fails fast via `docker image inspect` instead of
      # pulling on demand (fail-closed by design), so the image must already be present.
      # Keep this tag in sync with PostgresImage in
      # tests/Hexalith.EventStore.Server.LiveSidecar.Tests/Fixtures/Oq8PostgresqlFixture.cs.
      - name: Pull PostgreSQL container image
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: docker pull postgres:18.4

      - name: Run Live-Sidecar Integration Tests
        run: |
          dotnet test tests/Hexalith.EventStore.Server.LiveSidecar.Tests/ \
            --configuration Release \
            --no-restore \
            --results-directory TestResults/live-sidecar \
            --report-xunit-trx \
            --report-xunit-trx-filename live-sidecar-results.trx \
            --coverage \
            --coverage-output-format cobertura \
            --coverage-output coverage.cobertura.xml \
            -p:UseHexalithProjectReferences=false

      - name: Verify IntegrationTests serialized execution metadata
        run: |
          dotnet test tests/Hexalith.EventStore.IntegrationTests/Hexalith.EventStore.IntegrationTests.csproj \
            --configuration Release \
            --no-restore \
            --filter-class Hexalith.EventStore.IntegrationTests.AssemblyParallelizationTests \
            --results-directory TestResults/integration-parallelization \
            --report-xunit-trx \
            --report-xunit-trx-filename integration-parallelization-results.trx \
            -p:UseHexalithProjectReferences=false

      - name: Capture and validate OQ8 production evidence
        env:
          HEXALITH_OQ8_EVIDENCE_DIRECTORY: ${{ runner.temp }}/oq8-story-4-14
        run: |
          mkdir -p "$HEXALITH_OQ8_EVIDENCE_DIRECTORY"
          dotnet tests/Hexalith.EventStore.Server.LiveSidecar.Tests/bin/Release/net10.0/Hexalith.EventStore.Server.LiveSidecar.Tests.dll \
            -method Hexalith.EventStore.Server.LiveSidecar.Tests.Actors.IdempotencyAdmissionOq8PostgresqlTests.ProductionMatrix_IndependentProcessesPreserveAuthorityReplayExpiryAndLeakageInvariants \
            -noColor \
            -result-ctrf "${RUNNER_TEMP}/oq8-results.json"
          dotnet build tests/Hexalith.EventStore.Server.Tests/Hexalith.EventStore.Server.Tests.csproj \
            --configuration Release \
            --no-restore \
            -m:1 \
            -p:UseHexalithProjectReferences=false
          dotnet tests/Hexalith.EventStore.Server.Tests/bin/Release/net10.0/Hexalith.EventStore.Server.Tests.dll \
            -method Hexalith.EventStore.Server.Tests.Pipeline.SubmitCommandHandlerIdempotencyAdmissionTests.Handle_PendingEquivalent_ReturnsFirstWriterTaskEvidenceWithoutDownstreamWork \
            -method Hexalith.EventStore.Server.Tests.Pipeline.SubmitCommandHandlerIdempotencyAdmissionTests.Handle_Conflict_DeniesBeforeAggregateAndAdvisoryStores \
            -method Hexalith.EventStore.Server.Tests.Pipeline.SubmitCommandHandlerIdempotencyAdmissionTests.Handle_AdmissionStoreUnavailableFailsClosedBeforeRoute \
            -method Hexalith.EventStore.Server.Tests.Pipeline.SubmitCommandHandlerIdempotencyAdmissionTests.Handle_UnverifiableAdmission_ReturnsStableFailClosedOutcome \
            -method Hexalith.EventStore.Server.Tests.Pipeline.SubmitCommandHandlerIdempotencyAdmissionTests.Handle_UnknownOutcome_ReconcilesReadOnlyAndFinalizesExactAggregateResult \
            -method Hexalith.EventStore.Server.Tests.Pipeline.SubmitCommandHandlerIdempotencyAdmissionTests.Handle_UnknownOutcomeWithoutAuthoritativeResult_RemainsFailClosed \
            -method Hexalith.EventStore.Server.Tests.Actors.IdempotencyAdmissionActorTests.Coordinator_UnsafeLegacyInventoryDoesNoLifecycleAdmissionDirectoryOrMigrationWork \
            -method Hexalith.EventStore.Server.Tests.Actors.IdempotencyAdmissionActorTests.AdmitAsync_StateStoreUnavailableFailsClosedWithoutReservation \
            -method Hexalith.EventStore.Server.Tests.Actors.IdempotencyAdmissionActorTests.AdmitAsync_UnknownSchema_FailsClosedAsCorrupt \
            -method Hexalith.EventStore.Server.Tests.Actors.IdempotencyAdmissionActorTests.AdmitAsync_VerificationTagMismatchFailsClosedAsCollision \
            -method Hexalith.EventStore.Server.Tests.Actors.IdempotencyTenantLifecycleActorTests.MigrateLegacyAsync_RestartFromEveryDurablePhaseFinishesPinnedTarget \
            -method Hexalith.EventStore.Server.Tests.Actors.IdempotencyTenantLifecycleActorTests.MigrateLegacyAsync_UnsafeSourceEvidenceNeverPreparesTarget \
            -method Hexalith.EventStore.Server.Tests.Actors.PublicationRecoveryActivationTests.OnActivate_MissingCheckpointPruned_ReleasesTheRecoverableIdempotencyRecord \
            -method Hexalith.EventStore.Server.Tests.Pipeline.SubmitCommandHandlerIdempotencyAdmissionTests.Handle_RouteFailure_MarksUnknownOutcomeUnderSameFence \
            -method Hexalith.EventStore.Server.Tests.Pipeline.SubmitCommandHandlerIdempotencyAdmissionTests.Handle_WriteAheadFailureAfterFenceMarksUnknownOutcome \
            -method Hexalith.EventStore.Server.Tests.Actors.IdempotencyAdmissionExpiryTests.ValidateAuthorityAsync_PendingAcceptsOnlyExactExecuteAuthorityWithoutMutation \
            -method Hexalith.EventStore.Server.Tests.Actors.IdempotencyAdmissionExpiryTests.ValidateAuthorityAsync_UnknownOutcomeAcceptsOnlyExactReconciliationAuthorityWithoutMutation \
            -method Hexalith.EventStore.Server.Tests.Pipeline.SubmitCommandHandlerIdempotencyAdmissionTests.Handle_TamperedCapabilityLeavesAdmissionUnchangedBeforeBegin \
            -method Hexalith.EventStore.Server.Tests.Pipeline.SubmitCommandHandlerIdempotencyAdmissionTests.Handle_ContextThatLostDurableAuthorityPerformsZeroDownstreamWork \
            -method Hexalith.EventStore.Server.Tests.Actors.IdempotencyAdmissionDirectoryActorTests.AdvanceAsync_PromotionOrder_KeepsSourceCanonicalUntilDirectoryFlip \
            -method Hexalith.EventStore.Server.Tests.Actors.IdempotencyAdmissionActorTests.Coordinator_OrdinaryActivationResponseLossReprovesExactTargetBeforeAdvance \
            -noColor \
            -result-ctrf "${RUNNER_TEMP}/oq8-support-results.json"
          python3 tools/validate-oq8-platform-evidence.py \
            --capture-directory "$HEXALITH_OQ8_EVIDENCE_DIRECTORY" \
            --ctrf "${RUNNER_TEMP}/oq8-results.json" \
            --support-ctrf "${RUNNER_TEMP}/oq8-support-results.json" \
            --expected-runtime-version "$DAPR_RUNTIME_VERSION"

      - name: Upload fresh validated OQ8 capture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oq8-story-4-14-fresh-validated-capture
          path: ${{ runner.temp }}/oq8-story-4-14
          if-no-files-found: error
          retention-days: 7

      - name: Upload live-sidecar test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-sidecar-test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 7

      # NOTE: the Tier-3 `IntegrationTests` project spins up a full Aspire DistributedApplication
      # (Projects.Hexalith_EventStore_AppHost) which `dapr init` alone does not satisfy. Running it
      # reliably in GitHub-hosted CI needs a dedicated Aspire-in-CI setup and is tracked as a
      # follow-up — see sprint-change-proposal-2026-06-22-ci-release-retier.md.
