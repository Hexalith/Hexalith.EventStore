name: Release

# Publication is an explicit operator action. The full profile publishes the
# owner release, and the Contracts prerequisite uses its own qualification.
# Semantic Release selects the version from approved branch history. The
# unprotected preflight proves the live exact source has successful push CI and
# commitlint, plus full Integration for the exact 3.130.2 maintenance branch,
# before the protected production job starts.
on:
  workflow_dispatch:
    inputs:
      release-profile:
        description: Full release or the fixed owner-approved Contracts prerequisite
        type: choice
        default: full
        options:
          - full
          - contracts-prerequisite
          - contracts-prerequisite-verify

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-source:
    if: ${{ inputs.release-profile != 'contracts-prerequisite' && inputs.release-profile != 'contracts-prerequisite-verify' }}
    name: Verify exact current source proof
    runs-on: ubuntu-latest
    outputs:
      source-ci-workflow: ${{ steps.select-source-proof.outputs.source-ci-workflow }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Require current approved branch with exact-source push proofs
        id: select-source-proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: bash scripts/verify-release-source.sh
      - name: Set up pinned native analyzer runtime
        if: ${{ github.ref == 'refs/heads/release/parties-sdk-3.130.2' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install locked analyzer without lifecycle hooks
        if: ${{ github.ref == 'refs/heads/release/parties-sdk-3.130.2' }}
        run: npm ci --ignore-scripts
      - name: Qualify native maintenance candidate before production
        if: ${{ github.ref == 'refs/heads/release/parties-sdk-3.130.2' }}
        env:
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .hexalith/release-evidence/qualification
          node tools/verify-release-candidate.mjs | tee .hexalith/release-evidence/qualification/preproduction.json
      - name: Retain structured release qualification
        if: ${{ always() && github.ref == 'refs/heads/release/parties-sdk-3.130.2' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .hexalith/release-evidence/qualification/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

  release:
    name: Publish EventStore packages and container
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    outputs:
      oci-release-version: ${{ steps.semantic-release.outputs.oci-release-version }}
      oci-subjects: ${{ steps.semantic-release.outputs.oci-subjects }}
      oci-evidence-id: ${{ steps.release-evidence.outputs.artifact-id }}
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Select approved Builds execution identity
        id: builds-pin
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/heads/main) echo 'sha=29923b011061347e7f61ece16d59095889bde91a' >> "$GITHUB_OUTPUT" ;;
            refs/heads/release/parties-sdk-3.130.2) echo 'sha=30ea43a56330a9828ed0bb2e837289231d8630d1' >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
      - name: Checkout approved Builds actions for main
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hexalith/Hexalith.Builds
          ref: 29923b011061347e7f61ece16d59095889bde91a
          path: .hexalith/builds-execution
          persist-credentials: false
      - name: Checkout approved Builds actions for maintenance
        if: ${{ github.ref == 'refs/heads/release/parties-sdk-3.130.2' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hexalith/Hexalith.Builds
          ref: ${{ steps.builds-pin.outputs.sha }}
          path: .hexalith/builds-execution
          persist-credentials: false
      - name: Validate approved Builds execution identity
        shell: bash
        env:
          BUILDS_SHA: ${{ steps.builds-pin.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git -C .hexalith/builds-execution rev-parse HEAD)" = "$BUILDS_SHA"
      - name: Initialize root-declared submodules
        uses: ./.hexalith/builds-execution/Github/initialize-build
      - name: Initialize .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props', 'global.json', 'references/Hexalith.Builds/Props/Directory.Packages.props') }}
          restore-keys: nuget-
      - name: Validate declared package count
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.packages | length' tools/release-packages.json)" = "14"
      - name: Install npm dependencies
        run: npm ci
      - name: Verify npm dependency provenance and signatures
        run: npm audit signatures
      - name: Restore
        run: dotnet restore Hexalith.EventStore.slnx
      - name: Build
        run: dotnet build Hexalith.EventStore.slnx --no-restore --configuration Release -warnaserror
      - name: Set up arm64 emulation
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - name: Prepare release container publisher
        uses: ./.hexalith/builds-execution/Github/publish-containers
        with:
          container-projects: |
            src/Hexalith.EventStore/Hexalith.EventStore.csproj|eventstore
          builds-execution-sha: ${{ steps.builds-pin.outputs.sha }}
      - name: Resolve release publication freeze
        id: publish-gate
        shell: bash
        env:
          HEXALITH_RELEASE_PUBLISH_ENABLED: ${{ vars.HEXALITH_RELEASE_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          if [ "${HEXALITH_RELEASE_PUBLISH_ENABLED-}" = "true" ]; then
            echo "publish-enabled=true" >> "$GITHUB_OUTPUT"
            echo "Release publication is enabled for this repository."
            exit 0
          fi
          echo "publish-enabled=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=Release publication frozen::The repository variable HEXALITH_RELEASE_PUBLISH_ENABLED is not exactly 'true', so Semantic Release is skipped."
      - name: Revalidate current source before Semantic Release
        if: ${{ steps.publish-gate.outputs.publish-enabled == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_SHA: ${{ github.sha }}
          SOURCE_CI_WORKFLOW: ${{ needs.verify-source.outputs.source-ci-workflow }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          bash scripts/verify-release-source.sh
          if [ "$DISPATCH_REF" = "refs/heads/release/parties-sdk-3.130.2" ]; then
            # Read fresh remote branch/tag facts before any credential boundary.
            # Tags have no force refspec: changed published identities must refuse.
            git fetch --no-recurse-submodules --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+${DISPATCH_REF}:refs/remotes/origin/${DISPATCH_REF#refs/heads/}" "refs/tags/*:refs/tags/*"
            test "$(git rev-parse "refs/remotes/origin/${DISPATCH_REF#refs/heads/}")" = "$DISPATCH_SHA"
            mkdir -p .hexalith/release-evidence/qualification
            node tools/verify-release-candidate.mjs | tee .hexalith/release-evidence/qualification/pre-oidc.json
          fi
      - name: Require protected main for OCI provenance
        if: ${{ steps.publish-gate.outputs.publish-enabled == 'true' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: test "$GITHUB_REF_PROTECTED" = 'true'
      - name: Validate trusted publishing account
        if: ${{ steps.publish-gate.outputs.publish-enabled == 'true' }}
        shell: bash
        env:
          NUGET_TRUSTED_PUBLISHING_USER: ${{ vars.NUGET_TRUSTED_PUBLISHING_USER }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_TRUSTED_PUBLISHING_USER//[[:space:]]/}" ]; then
            echo "NUGET_TRUSTED_PUBLISHING_USER must name the nuget.org policy creator." >&2
            exit 1
          fi
      - name: Exchange GitHub OIDC for temporary NuGet key
        if: ${{ steps.publish-gate.outputs.publish-enabled == 'true' }}
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISHING_USER }}
      - name: Semantic Release
        id: semantic-release
        if: ${{ steps.publish-gate.outputs.publish-enabled == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUGET_TRUSTED_PUBLISHING_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          HEXALITH_ATTEST_CONTAINERS: ${{ github.ref == 'refs/heads/main' }}
          HEXALITH_CONTAINER_PROJECTS: src/Hexalith.EventStore/Hexalith.EventStore.csproj|eventstore
          HEXALITH_ZOT_REGISTRY: ${{ vars.HEXALITH_ZOT_REGISTRY || 'registry.hexalith.com' }}
          HEXALITH_ZOT_USERNAME: ${{ secrets.HEXALITH_ZOT_USERNAME }}
          HEXALITH_ZOT_API_KEY: ${{ secrets.HEXALITH_ZOT_API_KEY }}
          HEXALITH_BUILDS_EXECUTION_SHA: ${{ steps.builds-pin.outputs.sha }}
          HEXALITH_RELEASE_ENVIRONMENT: production
          HEXALITH_RELEASE_SOURCE_BRANCH: ${{ github.ref_name }}
          HEXALITH_RELEASE_SOURCE_CI_WORKFLOW: ${{ needs.verify-source.outputs.source-ci-workflow }}
          HEXALITH_RELEASE_PACKAGE_MANIFEST: tools/release-packages.json
          HEXALITH_RELEASE_EXPECTED_PACKAGE_COUNT: '14'
          HEXALITH_RELEASE_REQUIRE_AUTHORITY: 'false'
        shell: bash
        run: |
          if [ "$HEXALITH_ATTEST_CONTAINERS" = 'true' ]; then
            exec bash .hexalith/builds-execution/Github/publish-containers/run-semantic-release.sh
          fi
          exec npx semantic-release
      - name: Upload complete release evidence
        id: release-evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .hexalith/release-evidence/**
            !.hexalith/release-evidence/api-compatibility/**/scratch/**
          if-no-files-found: ${{ steps.semantic-release.outputs.oci-release-version != '' && 'error' || 'warn' }}
          include-hidden-files: true
          retention-days: 30

  attest-release:
    name: Attest published EventStore OCI index
    needs: release
    if: ${{ github.ref == 'refs/heads/main' && needs.release.outputs.oci-release-version != '' }}
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: Hexalith/Hexalith.Builds/.github/workflows/domain-release.yml@29923b011061347e7f61ece16d59095889bde91a
    with:
      builds-execution-sha: 29923b011061347e7f61ece16d59095889bde91a
      solution: Hexalith.EventStore.slnx
      environment-name: production
      release-mode: attest-published-oci-v1
      container-projects: src/Hexalith.EventStore/Hexalith.EventStore.csproj|eventstore
      published-oci-version: ${{ needs.release.outputs.oci-release-version }}
      published-oci-subjects: ${{ needs.release.outputs.oci-subjects }}
      published-oci-evidence-id: ${{ needs.release.outputs.oci-evidence-id }}

  qualify-contracts-prerequisite:
    if: ${{ github.ref == 'refs/heads/main' && (inputs.release-profile == 'contracts-prerequisite' || inputs.release-profile == 'contracts-prerequisite-verify') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.qualify.outputs.plan }}
    steps:
      - name: Initialize qualification failure receipt
        run: >-
          printf '%s\n' '{"status":"failed","failed_operation":"workflow initialization","reason":"qualification has not completed","push_attempted":false,"upload_count":0}' > prerequisite-qualification.json
      - name: Checkout immutable CiCd prerequisite verifier and approved archives
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hexalith/Hexalith.CiCd
          ref: 264e5de34341187a0ad4724dd6a39248b9cb9b58
          path: .prerequisite-owner
          submodules: false
          persist-credentials: false
          sparse-checkout: |
            tools/publish_contracts_prerequisite.py
            tools/test_publish_contracts_prerequisite.py
            docs/contracts-prerequisites
          sparse-checkout-cone-mode: false
      - name: Exercise fixed publisher controls without publication credentials
        run: python3 -B .prerequisite-owner/tools/test_publish_contracts_prerequisite.py
      - name: Initialize package signature verifier for read-only recovery
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '11.0.x'
      - name: Bind exact approved payload and package-only owner gates
        id: qualify
        env:
          GH_TOKEN: ${{ github.token }}
          PREREQUISITE_OWNER_SOURCE: 264e5de34341187a0ad4724dd6a39248b9cb9b58
          HEXALITH_RELEASE_PUBLISH_ENABLED: ${{ vars.HEXALITH_RELEASE_PUBLISH_ENABLED }}
          PREREQUISITE_OPERATION: ${{ inputs.release-profile == 'contracts-prerequisite-verify' && 'verify' || 'qualify' }}
        run: python3 -I .prerequisite-owner/tools/publish_contracts_prerequisite.py "$PREREQUISITE_OPERATION" --profile eventstore --report prerequisite-qualification.json
      - name: Retain exact-source prerequisite qualification
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contracts-prerequisite-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: prerequisite-qualification.json
          if-no-files-found: error
          retention-days: 90

  publish-contracts-prerequisite:
    needs: qualify-contracts-prerequisite
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && inputs.release-profile == 'contracts-prerequisite' && needs.qualify-contracts-prerequisite.result == 'success' && needs.qualify-contracts-prerequisite.outputs.plan != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Initialize publication failure receipts
        run: |
          printf '%s\n' '{"status":"failed","failed_operation":"workflow initialization","reason":"pre-OIDC qualification has not completed","push_attempted":false,"upload_count":0}' > prerequisite-pre-oidc.json
          printf '%s\n' '{"status":"failed","failed_operation":"workflow initialization","reason":"publisher has not completed","push_attempted":false,"upload_count":0}' > prerequisite-publication.json
      - name: Checkout only immutable CiCd prerequisite publisher and approved archives
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hexalith/Hexalith.CiCd
          ref: 264e5de34341187a0ad4724dd6a39248b9cb9b58
          path: .prerequisite-owner
          submodules: false
          persist-credentials: false
          sparse-checkout: |
            tools/publish_contracts_prerequisite.py
            docs/contracts-prerequisites
          sparse-checkout-cone-mode: false
      - name: Initialize package signature verifier
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '11.0.x'
      - name: Requalify immediately before OIDC exchange
        env:
          GH_TOKEN: ${{ github.token }}
          PREREQUISITE_OWNER_SOURCE: 264e5de34341187a0ad4724dd6a39248b9cb9b58
          HEXALITH_RELEASE_PUBLISH_ENABLED: ${{ vars.HEXALITH_RELEASE_PUBLISH_ENABLED }}
        run: python3 -I .prerequisite-owner/tools/publish_contracts_prerequisite.py qualify --profile eventstore --report prerequisite-pre-oidc.json
      - name: Exchange existing owner release identity for temporary NuGet key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISHING_USER }}
      - name: Publish the single approved archive and verify signed public payload
        env:
          GH_TOKEN: ${{ github.token }}
          PREREQUISITE_OWNER_SOURCE: 264e5de34341187a0ad4724dd6a39248b9cb9b58
          HEXALITH_RELEASE_PUBLISH_ENABLED: ${{ vars.HEXALITH_RELEASE_PUBLISH_ENABLED }}
          PREREQUISITE_QUALIFICATION: ${{ needs.qualify-contracts-prerequisite.result }}
          PREREQUISITE_PLAN: ${{ needs.qualify-contracts-prerequisite.outputs.plan }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: python3 -I .prerequisite-owner/tools/publish_contracts_prerequisite.py publish --profile eventstore --report prerequisite-publication.json
      - name: Retain publication outcome and verification
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contracts-prerequisite-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            prerequisite-pre-oidc.json
            prerequisite-publication.json
          if-no-files-found: error
          retention-days: 90
