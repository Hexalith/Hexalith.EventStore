name: Release

# Publication is an explicit operator action. The unprotected preflight proves
# the dispatch selected the current main tip and that exact source already has
# the selected successful push proof before the protected release environment is entered.
on:
  workflow_dispatch:
    inputs:
      bypass-validation:
        description: 'Use successful exact-source Commitlint proof instead of CI proof.'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-source:
    name: Verify exact live-main source proof
    runs-on: ubuntu-latest
    outputs:
      source-ci-workflow: ${{ steps.select-source-proof.outputs.source-ci-workflow }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require current main with selected exact-source proof
        id: select-source-proof
        shell: bash
        env:
          BYPASS_VALIDATION: ${{ inputs['bypass-validation'] }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$BYPASS_VALIDATION" in
            false)
              source_ci_workflow="ci.yml"
              ;;
            true)
              source_ci_workflow="commitlint.yml"
              ;;
            *)
              echo "bypass-validation must resolve to exactly true or false." >&2
              exit 1
              ;;
          esac
          printf 'source-ci-workflow=%s\n' "$source_ci_workflow" >> "$GITHUB_OUTPUT"

          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "Release must be dispatched from refs/heads/main." >&2
            exit 1
          fi
          if [[ ! "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The dispatch source must be an exact lowercase commit SHA." >&2
            exit 1
          fi

          live_main_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ ! "$live_main_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The live main SHA could not be resolved safely." >&2
            exit 1
          fi
          if [ "$DISPATCH_SHA" != "$live_main_sha" ]; then
            echo "The dispatched source is no longer the live main tip." >&2
            exit 1
          fi

          source_runs="$(gh api --method GET \
            "repos/${REPOSITORY}/actions/workflows/${source_ci_workflow}/runs" \
            -f branch=main \
            -f event=push \
            -f head_sha="$DISPATCH_SHA" \
            -f status=success \
            -f per_page=100)"
          if ! printf '%s\n' "$source_runs" | jq -e --arg sha "$DISPATCH_SHA" '
            [.workflow_runs[] | select(
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "push" and
              .status == "completed" and
              .conclusion == "success"
            )] | length > 0
          ' >/dev/null; then
            echo "No successful push ${source_ci_workflow} run exists for the exact current main SHA." >&2
            exit 1
          fi

  release:
    needs: verify-source
    # GitHub validates the maximum permissions of every job in a called workflow,
    # including the skipped governed-release job, so attestations/id-token must be
    # granted here even though `governed-release: false` keeps EventStore on the
    # legacy job. The legacy job declares no permissions of its own and therefore
    # INHERITS this set: it runs holding both write scopes without using them.
    # Nothing is signed or attested, but this is a real widening of the production
    # job's token, not a paper one. Narrowing it belongs to Hexalith.Builds -- see
    # deferred-work.md, "Split the governed release path into its own reusable workflow file".
    # Do not add attestation
    # or signing steps here: Epic 3 withholds that authority.
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: Hexalith/Hexalith.Builds/.github/workflows/domain-release.yml@22a578b576a515d2af214fe81859447fffc97981
    with:
      solution: Hexalith.EventStore.slnx
      timeout-minutes: 60
      environment-name: production
      governed-release: false
      publish-containers: true
      builds-execution-sha: 22a578b576a515d2af214fe81859447fffc97981
      source-branch: main
      source-ci-workflow: ${{ needs.verify-source.outputs.source-ci-workflow }}
      package-manifest: tools/release-packages.json
      # Caller-declared so an accidental change to the manifest fails closed
      # instead of redefining the gate it is checked against.
      expected-package-count: 14
      # Publication is gated by the protected `production` environment approval on the
      # release job. The dispatch-reserved version and one-use GitHub issue-comment
      # authority were a Story 3.14 corrective-release gate, not a release precondition;
      # declaring the opt-out here keeps that machinery available and unused. Turning it
      # back on means setting this true and supplying all three reservation inputs.
      require-publication-authority: false
      container-projects: |
        src/Hexalith.EventStore/Hexalith.EventStore.csproj|eventstore
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      HEXALITH_ZOT_USERNAME: ${{ secrets.HEXALITH_ZOT_USERNAME }}
      HEXALITH_ZOT_API_KEY: ${{ secrets.HEXALITH_ZOT_API_KEY }}
