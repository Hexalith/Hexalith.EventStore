name: Phase 4 transition fixtures

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    # Prepared required-check name; repository settings are intentionally not mutated.
    name: Phase 4 transition fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Verify publication lifecycle structural and refusal controls
        run: python3 -B -m unittest discover -s tools/tests -p 'test_publication_authority.py'
      - name: Verify authenticated transitions and rejection controls
        run: python3 -B -m unittest discover -s tools/tests -p 'test_phase_4_transition.py'
      - name: Verify actual G-OQ8 gate decision consumers
        run: python3 -B -m unittest discover -s tools/tests -p 'test_phase_4_gate_decision.py'
      - name: Verify spec and tracker completion boundaries
        run: python3 -B -m unittest discover -s tools/tests -p 'test_phase_4_story_completion.py'
      - name: Materialize pinned root build configuration for genuine scanner controls
        run: git -c submodule.recurse=false submodule update --init -- references/Hexalith.Builds
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify fixed Story 5.3 adapter contracts and complete-source refusals
        run: python3 -B -m unittest discover -s tools/tests -p 'test_phase_4_story_5_3.py'
      - name: Verify the actual Release status-link case identities
        run: |
          dotnet test tests/Hexalith.EventStore.RestApi.Generators.Tests/Hexalith.EventStore.RestApi.Generators.Tests.csproj \
            --configuration Release -p:UseHexalithProjectReferences=false \
            --results-directory "$RUNNER_TEMP/status-id" --report-xunit-trx --report-xunit-trx-filename generators.trx
          python3 -B tools/tests/check_phase_4_status_id_report.py "$RUNNER_TEMP/status-id/generators.trx"
      - name: Validate Phase 4 readiness requests and decisions against Draft 2020-12
        run: |
          python3 -m venv "$RUNNER_TEMP/readiness-schema"
          "$RUNNER_TEMP/readiness-schema/bin/python" -m pip install jsonschema==4.26.0
          "$RUNNER_TEMP/readiness-schema/bin/python" -B tools/tests/check_phase_4_readiness_schema.py
