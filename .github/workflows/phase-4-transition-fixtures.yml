name: Phase 4 transition fixtures

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    # Prepared required-check name; repository settings are intentionally not mutated.
    name: Phase 4 transition fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Verify authenticated transitions and rejection controls
        run: python3 -B -m unittest discover -s tools/tests -p 'test_phase_4_transition.py'
      - name: Verify actual G-OQ8 gate decision consumers
        run: python3 -B -m unittest discover -s tools/tests -p 'test_phase_4_gate_decision.py'
      - name: Verify spec and tracker completion boundaries
        run: python3 -B -m unittest discover -s tools/tests -p 'test_phase_4_story_completion.py'
      - name: Materialize pinned root build configuration for genuine scanner controls
        run: git -c submodule.recurse=false submodule update --init -- references/Hexalith.Builds
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify fixed Story 5.3 adapter contracts and complete-source refusals
        run: python3 -B -m unittest discover -s tools/tests -p 'test_phase_4_story_5_3.py'
