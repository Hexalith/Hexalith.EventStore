name: OQ8 governing-design availability

on:
  push:
    branches: [main, release/parties-sdk-3.130.2]
  pull_request:
    branches: [main, release/parties-sdk-3.130.2]
  workflow_dispatch:
    inputs:
      decision_request:
        description: Optional closed G-OQ8 transition request JSON for an assured availability decision
        required: false
        type: string
      sealed_run_id:
        description: Completed successful high-risk-gate-pass evaluation run ID
        required: false
        type: string
      sealed_attempt:
        description: Completed evaluation run attempt
        required: false
        type: string

permissions:
  contents: read

# oq8-governing-design:begin
env:
  OQ8_SOURCE_REPOSITORY: github.com/Hexalith/Hexalith.Folders
  OQ8_SOURCE_PATH: docs/exit-criteria/oq8-idempotency-design.md
  OQ8_SOURCE_COMMIT: a9cfea91c8a987ef7a836c216e633a92321fc3c2
  OQ8_DESIGN_VERSION: 1.0.0
  OQ8_DESIGN_SHA256: 1a55b0302e91233e12db91e6e245f0a22d6bf13fcf6cdf5ee0cbe5759f08dcd8
  OQ8_LOCAL_DESIGN: docs/architecture/oq8/oq8-idempotency-design.md
# oq8-governing-design:end

jobs:
  fixtures:
    name: OQ8 governing-design fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Test exact identity and rejection paths
        run: python3 -B -m unittest discover -s tools/tests -p 'test_oq8_governing_design.py'

  live-evaluation:
    name: OQ8 governing-design live evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Evaluate and report current authority availability
        shell: bash
        run: |
          status=0
          python3 -B tools/validate-oq8-governing-design.py || status=$?
          source_sha="$(git rev-parse HEAD)"
          workflow_digest="$(sha256sum .github/workflows/oq8-governing-design.yml | cut -d ' ' -f 1)"
          result=FAIL
          if [ "$status" -eq 0 ]; then
            result=PASS
          fi
          printf 'OQ8 governing-design availability: %s\nSource SHA: %s\nWorkflow SHA-256: %s\n' "$result" "$source_sha" "$workflow_digest" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"

  assured-decision:
    name: OQ8 assured availability decision
    if: github.event_name == 'workflow_dispatch' && (inputs.decision_request != '' || inputs.sealed_run_id != '' || inputs.sealed_attempt != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Consume authenticated G-OQ8 evaluation
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE4_REQUEST_JSON: ${{ inputs.decision_request }}
          SEALED_RUN_ID: ${{ inputs.sealed_run_id }}
          SEALED_ATTEMPT: ${{ inputs.sealed_attempt }}
        shell: bash
        run: |
          output="$RUNNER_TEMP/phase-4-gate-decision"
          mkdir -p "$output"
          python3 -B tools/validate-phase-4-gate-decision.py --request-env --run-id "$SEALED_RUN_ID" --attempt "$SEALED_ATTEMPT" --result "$output/result.json" >"$output/report.txt" 2>&1
      - name: Upload decision diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-4-gate-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase-4-gate-decision/
          if-no-files-found: error
          retention-days: 90
