name: Dependency Review

on:
  pull_request:
    branches: [main, release/parties-sdk-3.130.2]

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    permissions:
      contents: read
      pull-requests: write
    uses: Hexalith/Hexalith.Builds/.github/workflows/dependency-review.yml@main
