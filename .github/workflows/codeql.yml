name: CodeQL

on:
  push:
    branches: [main, release/parties-sdk-3.130.2]
  pull_request:
    branches: [main, release/parties-sdk-3.130.2]
  schedule:
    - cron: '27 3 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    uses: Hexalith/Hexalith.Builds/.github/workflows/codeql.yml@main
    permissions:
      security-events: write
      contents: read
    with:
      languages: csharp
      config-file: ./.github/codeql/codeql-config.yml
      timeout-minutes: 120
