name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    uses: Hexalith/Hexalith.Builds/.github/workflows/codeql.yml@main
    permissions:
      security-events: write
      contents: read
    with:
      languages: csharp
      # The complete tracked-source scan exceeded the former 30-minute job cap.
      # Retain its scope and analysis settings with a bounded longer allowance.
      timeout-minutes: 60
