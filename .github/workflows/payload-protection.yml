name: Payload Protection

# Blocking gate for the pdenc-v2 core engine (Story 8.3).
#
# Hexalith.EventStore.PayloadProtection and its test project are deliberately absent from
# Hexalith.EventStore.slnx and from the 14-package release inventory, so they are restored,
# built and tested as direct projects. This mirrors scripts/ci-local.sh.

on:
  push:
    branches: [main, release/parties-sdk-3.130.2]
  pull_request:
    branches: [main, release/parties-sdk-3.130.2]

concurrency:
  group: payload-protection-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  payload-protection:
    name: payload-protection
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Initialize root-declared submodules
        run: git -c submodule.recurse=false submodule update --init

      - name: Initialize .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up supported Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked npm dependencies
        run: npm ci

      - name: Verify owner qualification policy and recovery offline
        env:
          EXT_PROTECTION_INTEROP_CONFIGURATION: Release
          EXT_PROTECTION_INTEROP_PROJECT_REFERENCES: "false"
        run: python3 -m unittest discover -s tools/tests -p 'test_ext_protection_1*.py' -v

      - name: Restore PayloadProtection tests
        run: >-
          dotnet restore tests/Hexalith.EventStore.PayloadProtection.Tests/Hexalith.EventStore.PayloadProtection.Tests.csproj
          -p:Configuration=Release
          -p:UseHexalithProjectReferences=false

      - name: Build PayloadProtection tests
        run: >-
          dotnet build tests/Hexalith.EventStore.PayloadProtection.Tests/Hexalith.EventStore.PayloadProtection.Tests.csproj
          --no-restore
          --configuration Release
          -warnaserror
          -m:1
          -p:UseHexalithProjectReferences=false

      - name: Run PayloadProtection vectors
        run: >-
          dotnet test --project tests/Hexalith.EventStore.PayloadProtection.Tests/Hexalith.EventStore.PayloadProtection.Tests.csproj
          --no-build
          --configuration Release
          --minimum-expected-tests 324
          --fail-skips on
          --results-directory TestResults/Hexalith.EventStore.PayloadProtection.Tests
          --report-xunit-trx
          --report-xunit-trx-filename payload-protection-results.trx
          -p:UseHexalithProjectReferences=false

      - name: Verify invariant-globalization fail closed
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
        run: >-
          dotnet test --project tests/Hexalith.EventStore.PayloadProtection.Tests/Hexalith.EventStore.PayloadProtection.Tests.csproj
          --no-build
          --configuration Release
          --filter-method Hexalith.EventStore.PayloadProtection.Tests.AadPathTests.V029_InertPlatformNormalizer_FailsClosedThroughCoreWriteSeams
          --minimum-expected-tests 1
          --fail-skips on
          --results-directory TestResults/Hexalith.EventStore.PayloadProtection.Tests
          --report-xunit-trx
          --report-xunit-trx-filename payload-protection-invariant-globalization-results.trx
          -p:UseHexalithProjectReferences=false

      - name: Upload PayloadProtection test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: payload-protection-test-results
          path: TestResults/Hexalith.EventStore.PayloadProtection.Tests/**/*.trx
          if-no-files-found: error
          retention-days: 7
