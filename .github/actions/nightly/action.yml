name: EventStore brokers product checks
description: Uses the shared Release build and retains owned product fixtures.
runs:
  using: composite
  steps:
  - name: Run retained EventStore product checks
    shell: bash
    env:
      EXT_PROTECTION_INTEROP_CONFIGURATION: Release
      EXT_PROTECTION_INTEROP_PROJECT_REFERENCES: 'false'
    run: bash scripts/run-with-temp.sh python3 -B scripts/ci-product-checks.py brokers
  - name: Retain product results
    if: always()
    uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
    with:
      name: eventstore-brokers
      path: TestResults/brokers/**
      if-no-files-found: error
      retention-days: 7
      include-hidden-files: true
