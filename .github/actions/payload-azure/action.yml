name: Authorized Azure payload qualification
description: Runs only under the rendered private runner and approval environment
  with exact owner authority.
runs:
  using: composite
  steps:
  - name: Run separately authorized Azure conformance
    shell: bash
    env:
      QUALIFICATION_AUTHORITY_SHA256: ${{ env.HEXALITH_AUTHORITY_SHA256 }}
      QUALIFICATION_SOURCE_SHA: ${{ env.HEXALITH_SOURCE_SHA }}
    run: bash scripts/run-with-temp.sh python3 -B scripts/qualify-payload-azure.py
  - name: Retain Azure product results
    if: always()
    uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
    with:
      name: eventstore-payload-azure
      path: TestResults/azure-live*/**
      if-no-files-found: error
      retention-days: 7
