# Isolated contract-test subscriber effects. The AppHost references this component only in its opt-in test cohort.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: subscriber-proof-state
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "localhost:6379"
    - name: redisPassword
      value: ""
    - name: keyPrefix
      value: "appid"
scopes:
  - eventstore-test-subscriber
